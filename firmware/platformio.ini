; Stepper-Plucked-Strings-GMB firmware build configuration.
;
; Build targets (one PlatformIO env per ANNOUNCED board — a board is only claimed
; as supported if CI compiles it, audit P1.14):
;   * env:esp32-s3-devkitc-1  -> ESP32-S3 DevKitC-1 (native USB, 8 MB flash) — default
;   * env:esp32-wroom-32      -> classic ESP32-WROOM-32 DevKitC (no native USB, 4 MB)
;   * env:esp32-devkit-v1     -> DOIT ESP32 DevKit v1 (classic ESP32, 4 MB)
;   * native unit tests       -> see firmware/test/Makefile (plain g++, no PIO)
;
; The algorithmic core in src/core/ is pure C++17 and has no Arduino dependency, so
; it is shared by all envs and unit-tested on the host.
;
; Board differences that matter for these envs:
;   * STEP generation: FastAccelStepper uses the RMT/MCPWM peripherals on both the
;     S3 and the classic ESP32, but the classic part has FEWER free units — a
;     6-axis instrument is realistically an S3 job. The bank reports a per-axis
;     attachFault when no generator is available, so a too-small board fails loudly
;     at boot instead of silently not stepping.
;   * Native USB (USB-CDC / future USB-MIDI) exists ONLY on the S3 — the classic
;     ESP32 envs do NOT set ARDUINO_USB_* and must rely on Wi-Fi UDP / DIN UART MIDI.
;   * LEDC: the code uses the Arduino-ESP32 3.x API (ledcAttach) on every board, with
;     a 2.x fallback behind ESP_ARDUINO_VERSION_MAJOR. The S3 has more LEDC channels
;     than the classic ESP32, but the firmware caps direct servos at 8 either way.
;   * Flash: the S3 build uses the 8 MB partition table. The classic 4 MB boards use
;     no_ota.csv (2 MB app / 2 MB FS): OTA is not used by this project. All three
;     mount LittleFS for profiles and the web UI.
;   * Wire / Wire1: both hardware I2C controllers exist on all three (dual-bus works).
[platformio]
default_envs = esp32-s3-devkitc-1

; Settings shared by every board env (Arduino-ESP32 3.x via the pioarduino fork).
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit PWM Servo Driver Library@^3.0.1
    ; FastAccelStepper >= 0.31.0 is required for ESP-IDF 5.3 (Arduino-ESP32 3.1.x);
    ; 0.30.x fails on the MCPWM/gpio_matrix API. Pinned to a validated 1.x release.
    gin66/FastAccelStepper@1.2.7
    ESP32Async/AsyncTCP@^3.2.0
    ESP32Async/ESPAsyncWebServer@^3.6.0

[env:esp32-s3-devkitc-1]
; Covers BOTH DevKitC-1 revisions — they differ only in which GPIO carries the
; on-board RGB LED, which is a board-PROFILE concern (esp32-s3-devkitc-1 vs
; esp32-s3-devkitc-1-v1.1), not a compile-time one.
board = esp32-s3-devkitc-1
; Native USB present: enable USB-CDC on boot (Serial over USB, and room for a future
; native USB-MIDI transport).
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGMB_BOARD_ESP32S3_DEVKITC1=1
board_build.partitions = default_8MB.csv

[env:esp32-wroom-32]
; Classic ESP32-WROOM-32 (generic esp32dev). No native USB — no ARDUINO_USB_* flags.
; no_ota.csv: 2 MB app / 2 MB LittleFS, no OTA (unused by this project).
board = esp32dev
board_build.partitions = no_ota.csv
build_flags =
    ${env.build_flags}
    -DGMB_BOARD_ESP32_WROOM32=1

[env:esp32-devkit-v1]
; DOIT ESP32 DevKit v1 (classic ESP32). No native USB. Same 2 MB-app partition
; table as esp32-wroom-32.
board = esp32doit-devkit-v1
board_build.partitions = no_ota.csv
build_flags =
    ${env.build_flags}
    -DGMB_BOARD_ESP32_DEVKIT_V1=1
