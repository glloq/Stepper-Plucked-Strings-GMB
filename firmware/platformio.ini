; Stepper-Plucked-Strings-GMB firmware build configuration.
;
; Two ways to build:
;   * env:esp32-s3-devkitc-1  -> the real firmware (Arduino framework)
;   * native unit tests        -> see firmware/test/Makefile (plain g++, no PIO)
;
; The algorithmic core in src/core/ is pure C++17 and has no Arduino dependency,
; so it is shared by both and unit-tested on the host.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DGMB_BOARD_ESP32S3_DEVKITC1=1
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.1
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
board_build.partitions = default_8MB.csv

; PlatformIO's built-in native env can also run the core tests if desired.
[env:native]
platform = native
build_flags = -std=c++17 -DGMB_NATIVE=1
test_framework = custom
