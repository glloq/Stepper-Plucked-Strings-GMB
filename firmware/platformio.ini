; Stepper-Plucked-Strings-GMB firmware build configuration.
;
; Two ways to build:
;   * env:esp32-s3-devkitc-1  -> the real firmware (Arduino framework)
;   * native unit tests        -> see firmware/test/Makefile (plain g++, no PIO)
;
; The algorithmic core in src/core/ is pure C++17 and has no Arduino dependency,
; so it is shared by both and unit-tested on the host.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; Arduino-ESP32 3.x toolchain (pioarduino fork). The code uses the 3.x LEDC API
; (ledcAttach) and 14-bit servo PWM; the ServoBank keeps a 2.x fallback behind
; ESP_ARDUINO_VERSION_MAJOR for anyone pinning the old core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DGMB_BOARD_ESP32S3_DEVKITC1=1
build_unflags = -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit PWM Servo Driver Library@^3.0.1
    ; FastAccelStepper >= 0.31.0 is required for ESP-IDF 5.3 (Arduino-ESP32 3.1.x);
    ; 0.30.x fails on the MCPWM/gpio_matrix API. Pinned to a validated 1.x release.
    gin66/FastAccelStepper@1.2.7
    ESP32Async/AsyncTCP@^3.2.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
board_build.partitions = default_8MB.csv
