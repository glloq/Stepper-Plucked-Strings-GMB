<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Stepper-Plucked-Strings-GMB — Configuration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="simplified">
  <!--
    Single-page configuration interface for the ESP32-S3 MIDI instrument
    controller. Served from the ESP32's LittleFS; fully self-contained (no
    frameworks, no CDN, no build step). Opening this file directly runs the
    built-in mock backend so the whole UI is usable standalone.

    Scripts use a shared global GMB namespace (classic scripts, not ES modules)
    so mock mode works from file:// where module imports would be blocked.
  -->
  <div id="app" class="app">
    <noscript>This configuration interface requires JavaScript.</noscript>
  </div>

  <!-- Core (order matters): API client, then app shell, then view modules. -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/midimonitor.js"></script>
  <script src="js/midiselect.js"></script>
  <script src="js/sysex.js"></script>
  <script src="js/profiles.js"></script>
</body>
</html>
