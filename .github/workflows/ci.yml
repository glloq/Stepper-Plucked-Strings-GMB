name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-tests:
    name: Firmware core — native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build & run the native test suite
        working-directory: firmware/test
        run: make

  esp32-compile-check:
    name: Firmware — ESP32 platform compile-check (host stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++ curl
      - name: Compile the ESP32 platform layer against real ArduinoJson + stubs
        working-directory: firmware/test/hostcheck
        run: ./run.sh

  esp32-build:
    name: Firmware — ESP32-S3 build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Sync web UI into the LittleFS image
        working-directory: firmware
        run: ./sync_web_data.sh
      - name: Build firmware (esp32-s3-devkitc-1)
        working-directory: firmware
        run: pio run -e esp32-s3-devkitc-1

  web-lint:
    name: Web interface — JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every JS file
        run: |
          set -e
          for f in web-interface/js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  json-validate:
    name: Profiles — JSON validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate board & instrument profiles
        run: |
          set -e
          for f in board-profiles/*.json instrument-profiles/*.json; do
            echo "validating $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
