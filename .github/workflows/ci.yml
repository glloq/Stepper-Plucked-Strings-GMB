name: CI

# Runs on every push and pull request. Four independent jobs:
#   host-tests  — native C++ core unit tests (with -Werror and ASan/UBSan), the
#                 platform compile-check (main.cpp + ESP32 adapters) and the
#                 ServoBank / StepperBank runtime checks.
#   profiles    — JSON format lint, the generated board profiles, and the C++
#                 profile validator over every shipped instrument profile.
#   web-js      — syntax-checks every web JS file + behavioural tests of the pure UI logic.
#   firmware    — builds the ANNOUNCED ESP32 boards with PlatformIO (a board is only
#                 claimed as supported if it compiles here) and reports flash/RAM size.
on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (core + sanitizers + platform compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native core unit tests (-Wall -Wextra -Werror)
        working-directory: firmware/test
        run: make CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O1 -g"
      - name: Native tests under AddressSanitizer + UBSan
        working-directory: firmware/test
        run: |
          make clean
          make CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -O1 -g"
      - name: Host compile-check (main.cpp + platform adapters)
        run: bash firmware/test/hostcheck/run.sh
      - name: ServoBank routing + controlled-park + ActuatorResult check
        run: bash firmware/test/servobankcheck/run.sh
      - name: StepperBank motion + hard-stop + ActuatorResult check
        run: bash firmware/test/stepperbankcheck/run.sh

  profiles:
    name: Profile validation (JSON + generated boards + C++ validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON format lint (board + instrument profiles)
        run: |
          fail=0
          for f in board-profiles/*.json instrument-profiles/*.json; do
            echo "checking $f"
            jq empty "$f" || fail=1
          done
          exit $fail
      - name: Board profiles match BoardProfile.cpp (generated, never hand-edited)
        run: bash firmware/test/boardcheck/run.sh --check
      - name: C++ profile validator (profilecheck)
        run: bash firmware/test/profilecheck/run.sh

  web-js:
    name: Web interface JS syntax + behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check every web JS file
        run: |
          fail=0
          for f in web-interface/js/*.js; do
            echo "checking $f"
            node --check "$f" || fail=1
          done
          exit $fail
      - name: Behavioural tests of the pure UI logic
        run: node web-interface/test/run-tests.js

  web-browser:
    name: Web interface renders in a real browser
    runs-on: ubuntu-latest
    # node --check proves a file parses and run-tests.js proves the pure kernels
    # compute the right numbers. Neither can catch a view that calls a function
    # which does not exist: the render throws, the shell paints a "View error"
    # card, and every other check still passes. That is exactly how the Power &
    # safety tab once shipped broken, so this job is not optional.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Mount every view, step and tab
        run: node web-interface/test/smoke.js

  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - esp32-s3-devkitc-1
          - esp32-wroom-32
          - esp32-devkit-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }} (reports flash/RAM size)
        working-directory: firmware
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} | tee build.log
          {
            echo "### ${{ matrix.env }}"
            echo '```'
            grep -E "RAM:|Flash:" build.log || echo "(size line not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
